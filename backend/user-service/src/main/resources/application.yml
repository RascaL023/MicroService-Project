spring:
  application:
    name: user-service

  config:
    import:
      - optional:file:./global/public-config.yml
      - optional:file:./global/private-config.yml

      - optional:file:../../global/public-config.yml
      - optional:file:../../global/private-config.yml

  datasource:
    url: jdbc:postgresql://${database.host:localhost}:${database.port:5432}/${database.names.user_service:mcr_user}?sslmode=${database.sslmode:disable}
    username: ${database.username:postgres}
    password: ${database.password:}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password: ${redis.password:}
      database: ${redis.db:0}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show:
      sql: true
    format:
      sql: true

  web: 
    pageable: 
      default-page-size: 10
      max-page-size: 100

server:
  address: ${services.user.host:localhost}
  port: ${services.user.port:8082}

app:
  excel:
    max-row: 100
    user-import:
      header-start-row: 0
      columns: '{"name":"nama", "email":"email", "gender":"jeniskelamin", "major":"jurusan"}'
