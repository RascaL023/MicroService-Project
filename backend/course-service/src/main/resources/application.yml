spring:
  application:
    name: course-service

  config:
    import:
      - optional:file:./global/public-config.yml
      - optional:file:./global/private-config.yml

      - optional:file:../../global/public-config.yml
      - optional:file:../../global/private-config.yml

  datasource:
    url: jdbc:postgresql://${database.host:localhost}:${database.port:5432}/${database.names.course_service:mcr_course}?sslmode=${database.sslmode:disable}
    username: ${database.username:postgres}
    password: ${database.password:}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password: ${redis.password:}
      database: ${redis.db:0}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show:
      sql: true
    format:
      sql: true

  web: 
    pageable: 
      default-page-size: 10
      max-page-size: 100

server:
  address: ${services.course.host:localhost}
  port: ${services.course.port:8084}

services:
  url:
    user: http://${services.user.host:localhost}:${services.user.port:8082}/api/users
  internal_signature: ${security.internal_signature:atlanta331}
