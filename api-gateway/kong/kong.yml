_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://localhost:8081
    routes:
      - name: auth-public-route
        paths:
          - /api/auths
        strip_path: false

  - name: user-service
    url: http://localhost:8082
    routes:
      - name: user-public-route
        paths:
          - /api/users
          - /api/batches
        strip_path: false
        plugins:
          - name: my-session-injector
            config:
              redis_host: "127.0.0.1"
              redis_port: 6379
              redis_key_prefix: "session:"
              redis_ban_key: "banned:users"

  - name: course-service
    url: http://localhost:8084
    routes:
      - name: course-public-route
        paths:
          - /api/subjects
          - /api/groups
          - /api/enrollments
          - /api/group-schedules
          - /api/schedule-templates
          - /api/subject-materials
          - /api/subject-modules
        strip_path: false
        plugins:
          - name: my-session-injector
            config:
              redis_host: "127.0.0.1"
              redis_port: 6379
