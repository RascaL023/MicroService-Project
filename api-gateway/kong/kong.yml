_format_version: "3.0"
_transform: true

# plugins:
#   - name: my-session-injector
#     route: auth-protected-route

services:
  - name: auth-service
    url: http://localhost:8081
    routes:
      - name: auth-public-route
        paths:
          - /api/auths
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PATCH
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - Authorization
              credentials: false
              max_age: 3600
              preflight_continue: false

  - name: user-service
    url: http://localhost:8082
    routes:
      - name: user-public-route
        paths:
          - /api/users
          - /api/batches
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              credentials: false
              max_age: 3600
              preflight_continue: false
          - name: my-session-injector
            config:
              redis_host: "127.0.0.1"
              redis_port: 6379
              redis_key_prefix: "session:"
              redis_ban_key: "banned:users"

  - name: course-service
    url: http://localhost:8084
    routes:
      - name: course-public-route
        paths:
          - /api/subjects
          - /api/groups
          - /api/enrollments
          - /api/group-schedules
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              credentials: false
              max_age: 3600
              preflight_continue: false
          - name: my-session-injector
            config:
              redis_host: "127.0.0.1"
              redis_port: 6379
