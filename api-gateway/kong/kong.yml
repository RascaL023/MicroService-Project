_format_version: "3.0"
_transform: true

# plugins:
#   - name: my-session-injector
#     route: auth-protected-route

services:
  - name: auth-service
    url: http://localhost:8081
    routes:
      - name: auth-public-route
        paths:
          - /api/auths
          # - /api/auths/login
          # - /api/auths/register
          # - /api/auths/logout
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PATCH
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - Authorization
              credentials: false
              max_age: 3600
              preflight_continue: false

      # - name: auth-protected-route
      #   paths:
      #     - /api/auths
      #   strip_path: false

  - name: user-service
    url: http://localhost:8082
    routes:
      - name: user-public-route
        paths:
          - /api/users
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              credentials: false
              max_age: 3600
              preflight_continue: false
