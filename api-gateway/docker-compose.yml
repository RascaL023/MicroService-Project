services:
  kong:
    image: kong:3.6
    container_name: kong-gateway
    network_mode: host

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: debug
      KONG_PLUGINS: "bundled, my-session-injector"
      KONG_LUA_PACKAGE_PATH: "/kong/plugins/?.lua;/kong/plugins/?/init.lua;;"

    volumes: 
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ./plugins:/kong/plugins


  redis:
    image: redis:7
    container_name: kong-redis
    network_mode: host
    command: >
      redis-server
      --appendonly yes
      --save 60 1
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
